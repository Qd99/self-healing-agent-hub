<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Engineering Studio · V14 增量</title><style>
:root{color-scheme:light;--shell:#efeeea;--paper:#fcfbf8;--panel:#fffefa;--ink:#292d2b;--muted:#686e69;--line:#deded6;--hover:#e9eeea;--accent:#286d68;--wash:#e5efeb;--warn:#956523;--bad:#a8453d;--shadow:0 1px 2px #24292112,0 10px 32px #24292108;font:13px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}html.dark{color-scheme:dark;--shell:#191c1d;--paper:#222627;--panel:#272b2c;--ink:#e6e9e5;--muted:#a1aaa5;--line:#3c4442;--hover:#303c39;--accent:#92c7bf;--wash:#293d39;--warn:#e5b66e;--bad:#ef9a90;--shadow:0 1px 2px #0005,0 10px 32px #0003}*{box-sizing:border-box}body{margin:0;background:var(--shell);color:var(--ink)}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--line);background:var(--panel);border-radius:7px;padding:7px 10px}button{cursor:pointer;transition:background .14s,transform .1s,box-shadow .14s}button:hover{background:var(--hover);box-shadow:inset 0 1px 0 #ffffff14}button:active{transform:scale(.98)}button:focus-visible,a:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}a{color:var(--accent)}h1{font-size:23px;letter-spacing:-.5px;margin:6px 0}h2{font-size:16px;margin:0 0 10px}p{margin:5px 0 12px}.muted,small{color:var(--muted)}code{font:12px ui-monospace,Consolas,monospace;overflow-wrap:anywhere}.shell{display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100vh;padding:8px;gap:8px}aside{padding:15px 10px}.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;margin:4px 0 30px}.mark{border:1px solid var(--line);border-radius:7px;display:grid;place-items:center;width:29px;height:29px;background:var(--panel);box-shadow:var(--shadow)}.group{font-size:11px;color:var(--muted);padding:15px 8px 4px}nav button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border-color:transparent;padding:9px 8px}nav button.on{background:var(--wash);border-color:var(--line);color:var(--accent);font-weight:600}svg.ico{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}.work{min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px;border-bottom:1px solid var(--line)}.bar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.space{justify-content:space-between}.main{padding:22px 26px 36px;max-width:1500px;margin:auto}.eyebrow{font-size:11px;letter-spacing:.08em;color:var(--muted)}.note{padding:10px 12px;border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;margin:14px 0;color:var(--muted)}.tabs{display:flex;gap:5px;border-bottom:1px solid var(--line);margin:18px 0 14px;flex-wrap:wrap}.tabs button{border:0;background:none;border-radius:0;padding:9px 12px;border-bottom:2px solid transparent;color:var(--muted)}.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}.surface{border:1px solid var(--line);border-radius:9px;background:var(--panel);box-shadow:0 1px 2px #24292108;overflow:hidden}.pad{padding:16px}.split{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(250px,1fr);gap:14px}.kv{display:grid;grid-template-columns:110px minmax(0,1fr);gap:9px;padding:12px 0;border-bottom:1px solid var(--line)}.kv:last-child{border:0}.tag{font-size:11px;color:var(--muted);white-space:nowrap}.warn{color:var(--warn)}.bad{color:var(--bad)}.good{color:var(--accent)}.stats{display:flex;gap:24px;flex-wrap:wrap;padding:15px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);margin:12px 0}.stats strong{display:block;font-size:20px;font-weight:550;font-variant-numeric:tabular-nums}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:11px;font-weight:500;color:var(--muted);background:var(--paper)}td,th{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:top}tr:last-child td{border-bottom:0}tbody tr:hover{background:var(--hover)}td button{border:0;background:none;text-align:left;padding:0;color:var(--accent)}.detail{position:sticky;top:10px;align-self:start}.graph{overflow:auto;background-image:radial-gradient(var(--line) .7px,transparent .7px);background-size:16px 16px;padding:10px;min-height:240px}.graph svg{display:block;min-width:640px;max-width:none}.graph rect{fill:var(--panel);stroke:var(--line)}.graph text{fill:var(--ink);font:12px system-ui}.graph path{stroke:var(--muted);stroke-width:1.4;fill:none}.graph g[role=button]{cursor:pointer}.graph g:focus rect,.graph g.sel rect{stroke:var(--accent);stroke-width:2}.wfbar{height:10px;border-radius:3px;background:var(--accent);opacity:.7}.empty{padding:42px 18px;text-align:center;color:var(--muted)}.footer{margin-top:22px;color:var(--muted);font-size:12px}.drawer{animation:enter .18s ease-out}@keyframes enter{from{opacity:.5;transform:translateX(7px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}@media(max-width:900px){.shell{grid-template-columns:1fr;padding:5px}.brand{margin:0 0 8px}aside{padding:7px}nav{display:flex;overflow:auto;gap:5px}nav .group{display:none}nav button{width:auto;white-space:nowrap}.split{grid-template-columns:1fr}.detail{position:static}.main{padding:16px}.top{padding:10px 12px}.stats{gap:16px}}
</style><body><div class="shell"><aside><div class="brand"><span class="mark">H</span> Engineering Studio</div><div class="muted">V14 · 可见增量设计</div><nav id="nav"></nav><p class="footer">离线原型 · 非生产<br>仅展示本轮设计范围</p></aside><div class="work"><header class="top"><span class="muted">Workspace / <span id="crumb"></span></span><div class="bar"><span class="tag">设计待评审</span><button id="theme">切换深浅色</button></div></header><main class="main" id="main"></main></div></div>
<script>
const $=s=>document.querySelector(s), icons={vendor:'<path d="M4 6h16v12H4z M4 10h16 M8 14h3"/>',trace:'<path d="M4 5h5v5H4z M15 14h5v5h-5z M9 7.5h8.5V14 M9 10v6.5H15"/>',connect:'<path d="M8 3v5m8-5v5M6 8h12v3a6 6 0 0 1-12 0z M12 17v4"/>',delivery:'<path d="M3 6h18v12H3z M3 10h18 M8 14h8"/>'};
const nav=[['trace','全链路'],['delivery','测试与交付证据'],['vendor','技术雷达 / 内嵌依赖'],['connect','连接设置']];
let page='vendor',tab=0,selected=0,scenario='sample',zoom=100,query='',replay=3,attempt='2';
const states={sample:'示例快照',loading:'加载中',empty:'无匹配记录',unknown:'未观测 / 未知',offline:'断连：保留旧数据',stale:'陈旧：不可用于放行',denied:'无读取权限',readonly:'只读：无操作权限',error:'查询失败，可重试'};
const candidate=[['审查进程退出','plugins/delivery/review.ts','待本地复现','#389','适配待评审'],['Windows Codex 发现','plugins/codex/agent.ts','支持平台待确认','#387','暂缓待决'],['额度恢复协议','protocol/validate.ts','与 #15 预算规则待核对','limitedUntil','适配待评审']];
function kv(a){return a.map(([k,v])=>'<div class="kv"><span class="muted">'+k+'</span><span>'+v+'</span></div>').join('')}
function table(h,r){return '<div class="scroll"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+r.map(x=>'<tr>'+x.map(v=>'<td>'+v+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function btn(t,i){return '<button data-pick="'+i+'">'+t+'</button>'}function tabs(a){return '<div class="tabs">'+a.map((t,i)=>'<button class="'+(i===tab?'on':'')+'" data-tab="'+i+'">'+t+'</button>').join('')+'</div>'}
function panel(t,v){return '<section class="surface pad"><h2>'+t+'</h2>'+v+'</section>'}
function header(t,desc){return '<div class="row space"><div><div class="eyebrow">ENGINEERING STUDIO / V14</div><h1>'+t+'</h1><p class="muted">'+desc+'</p></div><label class="bar">演示状态 <select id="scenario">'+Object.entries(states).map(([k,v])=>'<option value="'+k+'" '+(k===scenario?'selected':'')+'>'+v+'</option>').join('')+'</select></label></div><div class="note">所有运行、版本与测试状态均为离线示例；不连接生产、不授予开发或发布权限。仓库核查基线：<code>0bc418319f628</code>。</div>'}
function vendor(){const c=candidate[selected]||candidate[0];return header('内嵌依赖','技术雷达 · Autoloop 版本来源、差异与验收 / #24')+tabs(['来源与差异','兼容矩阵','评审与验收'])+(tab===0?'<div class="split"><section><div class="surface pad"><h2>Autoloop · 版本对照</h2>'+kv([['当前来源','<span class="warn">祖先版本未知</span>'],['本仓基线','<code>0bc418319f628</code>'],['上游候选','v1.10.1 · <code>62feecc7dbf9</code>'],['签名 / 许可','签名未知 · MIT 文件相同（调研证据）']])+'<div class="stats">'+[['相同','199'],['修改','64'],['仅上游','5'],['仅本仓','1']].map(([a,b])=>'<div><strong>'+b+'</strong><small>'+a+'</small></div>').join('')+'</div><small>引用 #24 固定树静态比较，非缺陷数量；非线上版本。</small></div><div class="bar space" style="margin:16px 0 8px"><h2>选择性采纳候选</h2><input id="q" aria-label="筛选候选" placeholder="搜索候选 / 路径"></div><section class="surface">'+table(['候选 / 路径','证据','决定'],candidate.map((x,i)=>[btn(x[0],i)+'<br><code>'+x[1]+'</code>',x[3],x[4]]))+'</section></section><section class="surface pad detail drawer"><h2>'+c[0]+'</h2>'+kv([['路径','<code>'+c[1]+'</code>'],['适用性',c[2]],['上游证据',c[3]],['候选状态',c[4]],['开发授权','未授予'],['验收','未执行']])+'<p><a href="https://github.com/Qd99/self-healing-agent-hub/issues/24">查看需求与原始证据</a></p><button disabled>执行升级（需独立授权）</button></section></div>':tab===1?panel('兼容矩阵',table(['验收范围','目标','状态'],[['Node / Hub','Node 24 与根项目','未执行'],['协议与数据','新旧状态及回放','待冻结'],['Windows','支持矩阵','待决'],['隔离与预算','#16 / #15','待评审'],['回滚','独立 QA 验证','未执行']])):panel('评审与验收',kv([['REQ-01','来源 / 固定树 / 截断阻断'],['REQ-02','选择性采纳 / 基线变更失效'],['REQ-03','固定 SHA / 完整命令 / 回退'],['审批','未授予开发授权'],['实际版本','未观测'],['门禁','未执行，不可部署']])));}
const nodes=[['产品评审','完成',20,35],['开发 A','示例已完成',205,12],['开发 B','示例已完成',205,100],['独立 QA','示例失败',390,56],['交付','依赖阻塞',575,56]];
function nodeState(i){if(attempt==='1')return '未观测';if(replay===3)return nodes[i][1];if(replay===0)return '未观测';if(i===0)return '示例完成';if(replay===2&&[1,2].includes(i))return '示例完成';return '未观测'} function trace(){let n=nodes[selected]||nodes[3];let graph='<div class="bar space"><span class="muted">依赖边 / 同一 Workflow 的尝试 '+attempt+'</span><div class="bar"><button data-zoom="-20">−</button><span>'+zoom+'%</span><button data-zoom="20">+</button><button data-fit>适配</button></div></div><div class="graph"><svg viewBox="0 0 740 190" width="'+740*zoom/100+'"><path d="M160 61H180V38H205 M180 61V126H205 M345 38H365V82H390 M345 126H365V82 M530 82H575"/>'+nodes.map((v,i)=>'<g tabindex="0" role="button" aria-label="'+v[0]+'" data-pick="'+i+'" class="'+(selected===i?'sel':'')+'"><rect x="'+v[2]+'" y="'+v[3]+'" width="140" height="52" rx="7"/><text x="'+(v[2]+10)+'" y="'+(v[3]+19)+'">'+v[0]+'</text><text x="'+(v[2]+10)+'" y="'+(v[3]+37)+'">'+nodeState(i)+'</text></g>').join('')+'</svg></div>';
return header('全链路观测','Workflow / Attempt / 依赖与观测事实 · #6 #7 #8 #12 #13 #14')+'<div class="bar"><label>Workflow <code>demo-wf-014</code></label><label>尝试 <select id="attempt"><option '+(attempt==='1'?'selected':'')+'>1</option><option '+(attempt==='2'?'selected':'')+'>2</option></select></label><label>历史游标 <input id="replay" type="range" min="0" max="3" value="'+replay+'"></label><span class="tag">只读回放 '+replay+'/3 · 未采集不推断</span></div>'+tabs(['拓扑 DAG','Span / 瀑布','日志','证据'])+'<div class="split"><section class="surface pad">'+(tab===0?graph:(attempt==='1'||replay<3)?'<p class="muted">该示例切片没有对应 Span、日志或证据；不得沿用后续尝试。</p>':tab===1?table(['Span / 来源','相对时间（示例）','用量'],[['<button data-pick="1">span-A · Worker</button>','<div class="wfbar" style="width:50%"></div>','未知'],['<button data-pick="3">span-QA · TestRunner</button>','<div class="wfbar" style="width:30%;margin-left:55%"></div>','未采集']]):tab===2?'<p>日志未采集 · 不显示模型隐藏推理、原始凭据。</p>':kv([['候选 SHA','示例 candidate-demo'],['门禁','拒绝：目标断言仍失败'],['来源','独立 QA（示例）']])+'<button data-go="delivery">查看独立示例证据工作区</button>')+'</section><section class="surface pad drawer"><h2>'+n[0]+' · 检查器</h2>'+kv([['节点 ID','<code>demo-node-'+selected+'</code>'],['Span ID',tab===1&&attempt==='2'&&replay===3&&[1,3].includes(selected)?'示例 span（与节点 ID 分离）':'未关联'],['状态',nodeState(selected)],['租约 / 工作区','未观测'],['模型 / 版本','未知'],['Token / 费用','未知（禁止补零）'],['数据完整性','partial · 无自动跨系统关联'],['用量来源','CLI 累计 / OTLP 逐请求须去重，实际响应模型未观测']])+'<button data-go="delivery">打开独立示例证据（非当前切片证明）</button></section></div>'}
function delivery(){return header('测试与交付证据','固定候选 · 独立验收 · 版本核对 / #4 #8 #9 #10 #11')+tabs(['红绿差分','交付时间线'])+(tab===0?panel('同一目标断言 · 同一冻结套件',table(['用例 / 断言','基线','候选','差分'],[['case-demo-01','<span class="bad">失败</span>','<span class="bad">失败</span>','未修复'],['case-demo-02','<span class="good">通过</span>','未知','阻断']])+kv([['目标 oracle','示例 assertion-01 · 断言身份待冻结'],['套件 / 环境','示例指纹 · 未验证'],['历史失败策略','候选全绿为建议默认 · 待产品确认'],['框架/跳过/超时/flaky','必须独立分类；未知阻断'],['门禁','拒绝 · 未证明先红后绿'],['实际 Harness','未验收']])):panel('交付状态',kv([['代码候选','示例 SHA · 未验证'],['PR','Draft · 非已合并'],['Jenkins CI','未执行 / 无当前 SHA 证据'],['部署','未执行'],['环境实际版本','未观测'],['发布授权','未授予']])) )+'<p><button data-go="trace">返回全链路</button></p>'}
function connect(){return header('连接设置','控制面与执行面分离 · #3 v2 一期只读 report / #16')+'<div class="split">'+panel('Hub 控制面',kv([['连接','示例 online'],['commit','未观测'],['最后有效心跳','未知'],['权限','只读原型']]))+panel('Autoloop 执行面',kv([['连接','<span class="warn">unknown</span>'],['实例 / generation','未知'],['同步延迟','未知'],['一期路由','doc-outdated → report'],['取消','请求 / 确认 / 未知分别展示'],['健康检查','/healthz 不等于实例身份']]))+'</div><div class="note">修改与发布仍由原 Worker 负责。#16 未冻结安全能力矩阵，取消执行策略待决；无 owner 密钥展示。</div>'}
function render(){const current=nav.find(x=>x[0]===page);$('#crumb').textContent=current[1];$('#nav').innerHTML=nav.map(([k,t])=>'<button data-go="'+k+'" class="'+(page===k?'on':'')+'"><svg class="ico" viewBox="0 0 24 24">'+icons[k]+'</svg>'+t+'</button>').join('');$('#main').innerHTML=({vendor,trace,delivery,connect}[page])();if(!['sample','offline','stale','readonly'].includes(scenario)){const title=$('#main h1').textContent;$('#main').innerHTML=header(title,'状态演示')+'<div class="surface empty"><h2>'+states[scenario]+'</h2><p>不展示未取得的事实，不允许放行。</p>'+(scenario==='error'?'<button data-retry>重试（仅模拟）</button>':'')+'</div>'}else if(scenario!=='sample')$('#main').insertAdjacentHTML('afterbegin','<div class="note">'+states[scenario]+' · 下方为标注的示例历史快照</div>');if(page==='vendor'&&$('#q')){$('#q').value=query;filter()}}
function filter(){let rows=[...document.querySelectorAll('tbody tr')];rows.forEach(x=>x.hidden=!x.textContent.toLowerCase().includes(query.toLowerCase()));let e=$('#filter-empty');if(!e&&rows.length){e=document.createElement('p');e.id='filter-empty';e.className='muted';e.textContent='没有匹配的候选';rows[0].closest('table').after(e)}if(e)e.hidden=rows.some(x=>!x.hidden)}
function go(p){page=p;tab=0;selected=0;query='';history.replaceState(null,'','#'+p);render()}
document.addEventListener('click',e=>{const b=e.target.closest('button,[role=button]');if(!b||b.disabled)return;if(b.id==='theme'){document.documentElement.classList.toggle('dark');return}if(b.dataset.go)go(b.dataset.go);else if(b.dataset.tab!==undefined){tab=+b.dataset.tab;render()}else if(b.dataset.pick!==undefined){selected=+b.dataset.pick;render()}else if(b.dataset.zoom){zoom=Math.max(60,Math.min(180,zoom+ +b.dataset.zoom));render()}else if(b.hasAttribute('data-fit')){zoom=100;render()}else if(b.hasAttribute('data-retry')){scenario='sample';render()}});
document.addEventListener('keydown',e=>{if(e.target.matches('g[role=button]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('change',e=>{if(e.target.id==='scenario'){scenario=e.target.value;render()}else if(e.target.id==='attempt'){attempt=e.target.value;render()}else if(e.target.id==='replay'){replay=+e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='q'){query=e.target.value;filter()}});if(nav.some(x=>x[0]===location.hash.slice(1)))page=location.hash.slice(1);render();
</script></body></html>
