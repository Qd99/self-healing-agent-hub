const delivery=()=>head('交付中心','从候选、PR、Jenkins CI、测试环境部署到生产版本核验。',btn('查看链路','gotrace','branch'))+`<div class="panel">${tabs(['交付记录','Pull Requests','Jenkins','部署与核验'])}${toolbar(['全部','待核对','阻塞','已合并'])}${rows(['交付对象','PR / SHA','CI','测试环境','生产版本','状态'],[['<b>构建产物校验</b><small>WF-1042</small>','未创建',S('未执行'),S('未授权'),'—',S('阻塞','warn')],['<b>修复任务状态同步</b><small>WF-1036</small>','PR #demo · a21c',S('通过','good'),S('已核验','good'),'未知',S('待核对','warn')],['<b>隔离工作区</b><small>WF-1033</small>','PR #demo · b11d',S('通过','good'),S('未核验'),'—',S('已合并','good')]])}</div><div class="gridEq">${panel('交付验证','候选身份绑定',qrow('branch','HEAD / Base SHA','新 SHA 使旧验证失效','trace')+qrow('check','可信 CI 检查','必须绑定同一候选 SHA','tests')+qrow('ship','环境实际版本','部署回执与探测结果分开','security'))}${panel('风险提醒','不推断成功',`<div class="infoitem"><b>已合并 ≠ 已上线</b><p>生产版本未知时必须保持待核验。</p></div><div class="infoitem"><b>外部回执未知</b><p>先读回 GitHub / Jenkins 真实状态，再允许重试。</p></div>`)}</div>`;
const dataPages={healing:{title:'自愈中心',desc:'发现台账、复诊队列、错误指纹、有限修复及转人工。',tabs:['缺陷发现','复诊队列','修复历史'],cols:['缺陷 / 指纹','来源','影响环境','重试预算','状态'],data:[['<b>候选回归新增失败</b><small>F-1042 · sha256:example</small>','TestRunner','dev', '2 / 3',S('阻塞','bad')],['<b>执行器心跳过期</b><small>F-1041</small>','Worker','dev','1 / 3',S('待复诊','warn')],['<b>环境资源锁未释放</b><small>F-1038</small>','巡检','test','0 / 2',S('待核对','warn')]],note:'同指纹冷却、预算及版本变化后复诊；未知外部结果禁止盲目重试。'},monitor:{title:'监控面板',desc:'任务吞吐、延迟、成本、告警和观测覆盖。Grafana 深链与真实数据源分离。',tabs:['概览','告警','数据源'],cols:['指标 / 数据源','最近样本','采集状态','说明'],data:[['<b>Grafana / Prometheus</b>','—',S('未连接'),'仅原型；实际查询待实现'],['<b>Trace / OTel</b>','—',S('未知'),'采集完整性未知'],['<b>Agent 用量 / Token</b>','—',S('未知'),'缺失数据不计零'],['<b>队列积压</b>','示例 8',S('需关注','warn'),'示例趋势，不是生产指标']],note:'区分连接验证、指标查询、采样率与数据更新时间。缺失成本显示 unknown。'},audit:{title:'操作记录',desc:'审计主体、动作、目标版本、权限结果、证据与幂等记录。',tabs:['全部事件','权限拒绝','外部动作'],cols:['动作','主体','对象','结果','时间'],data:[['<b>gate.evaluate</b>','Trusted Runner','WF-1042',S('拒绝','warn'),'10:18:34'],['<b>agent.claim</b>','Worker 01','WF-1042',S('已记录','good'),'10:04:16'],['<b>deploy.request</b>','Operator','example-a82d',S('未授权'),'10:19:01']],note:'保留原始记录，敏感信息遮蔽；只读审计不提供删除或改写。'},workers:{title:'执行器与规则',desc:'引擎身份、健康、并发能力、工作区、策略和最近通信。',tabs:['执行器','路由规则','工作区'],cols:['执行器 / 规则','能力','当前任务','心跳','状态'],data:[['<b>Worker 01</b><small>示例 · Codex</small>','开发 / Git','WF-1042','10:18:10',S('在线（示例）','good')],['<b>Worker 02</b><small>示例 · Claude</small>','审查 / 测试','WF-1040','—',S('未知')],['<b>可信 TestRunner</b>','隔离执行','—','—',S('未连接')]],note:'现有 Hub/Autoloop 集成待验收。连接、授权、租约、隔离工作区不得混为同一状态。'},knowledge:{title:'知识与评估',desc:'按项目管理可追溯知识、Agent / 模型 / Skills 的基线评估与候选。',tabs:['知识库','上下文引用','能力评估','A/B 对比'],cols:['对象','版本 / 证据','适用范围','状态'],data:[['<b>Jenkins 构建失败经验</b>','knowledge:v2','dev / Jenkins',S('待批准','warn')],['<b>测试隔离规则</b>','policy:v1','TestRunner',S('已批准','good')],['<b>代码审查提示词</b>','skill:v3','review',S('已失效')]],alt:[['<b>Claude / baseline</b>','eval-set:v1','通过率 82% · 示例',S('基线','good')],['<b>Codex / candidate</b>','eval-set:v1','通过率 86% · 示例',S('待评审','warn')],['<b>Skill v3</b>','eval-set:v1','耗时 / 成本未知',S('待核对','warn')]],note:'知识注入显示引用和版本；评估推广与实际执行授权分离，缺失成本不填零。'},radar:{title:'技术雷达',desc:'每日发现、现有代码差异、采纳候选、未采纳理由及需求登记。',tabs:['每日发现','候选对比','不采纳','已登记'],cols:['发现 / 需求','来源','适配判断','状态'],data:[['<b>Agent 独立能力评估</b><small>关联 #21</small>','官方资料 / 代码','需要独立 eval',S('待评审','warn')],['<b>跨 Agent 工程知识</b><small>关联 #20</small>','官方资料 / 代码','适配上下文注入',S('待评审','warn')],['<b>重复工作流引擎</b>','研究候选（示例）','已有执行层，不重复建',S('不采纳')]],note:'研究候选不是已批准需求；登记前核对真实代码、重复 Issue 和人工决定。'},security:{title:'安全与环境',desc:'项目、环境、权限、资源锁、沙箱及拒绝审计。',tabs:['环境与资源锁','安全策略','角色权限','测试数据'],cols:['资源 / 策略','范围','当前约束','状态'],data:[['<b>dev-test environment</b>','项目 A · dev','独占租约',S('占用','warn')],['<b>Agent sandbox</b>','Worker 01','网络白名单 · 只读根',S('待验证','warn')],['<b>Trusted publisher</b>','交付阶段','仅授权候选 SHA',S('未授权')]],note:'配置变更须审阅；拒绝显示原因，不展示任何密钥。未来 RBAC/资源锁 API 待实现。'},settings:{title:'连接设置',desc:'管理服务、Autoloop、GitHub、Jenkins、Grafana 及通知通道；连接与能力验证分离。',tabs:['集成连接','通知通道','系统状态'],cols:['连接','作用','最后验证','状态'],data:[['<b>Hub 管理 API</b>','任务与审批','—',S('未连接')],['<b>Autoloop 执行层</b>','规则 / Agent','—',S('未知')],['<b>GitHub</b>','需求 / PR','—',S('未连接')],['<b>Jenkins</b>','CI / 回归','—',S('未验证')],['<b>Grafana</b>','指标源身份','—',S('未验证')],['<b>飞书</b>','审批与通知','—',S('未连接')]],note:'不保存真实凭据，连接检查结果应显示时间、范围及错误；禁止展示假在线。'}};
function generic(k){const x=dataPages[k];return head(x.title,x.desc,btn('刷新预览','refresh','refresh'))+(k==='monitor'?metrics([['吞吐 / 小时','—','未接入指标','activity','monitor'],['P95 延迟','—','无样本','clock','monitor'],['模型成本','—','未采集','chart','monitor'],['活跃告警','—','待连接','alert','monitor']]):'')+`<div class="panel" style="margin-top:14px">${tabs(x.tabs)}${toolbar(['全部','待评审','待核对','未知','未连接','待批准','已批准','未授权'])}${rows(x.cols,k==='knowledge'&&tab>=2?x.alt:x.data)}<div class="infoitem"><b>交互约束</b><p>${x.note}</p></div></div>`+(k==='monitor'?`<div class="gridEq">${panel('任务吞吐','未连接 · 不生成曲线',`<div class="empty">${I('chart')}<b>没有可验证的指标样本</b>连接验证成功并不等于指标查询成功。</div>`)}${panel('告警处理','示例状态',qrow('alert','连接或采集故障','未知数据覆盖','settings'))}</div>`:'')}
function render(){document.querySelector('#nav').innerHTML=groups.map(g=>`<div class="group">${g[0]}</div>${g[1].map(([id,label,ico])=>`<button data-go="${id}" class="${page===id?'active':''}" aria-label="${label}" title="${label}">${I(ico)}<span>${label}</span>${id==='requirements'?'<span class="end">3</span>':''}</button>`).join('')}`).join('');document.querySelector('#crumb').textContent=lookup[page][1];document.querySelector('#theme').innerHTML=I(dark?'sun':'moon');const content={overview,tasks,requirements:reqs,trace,tests,delivery}[page];let html=content?content():generic(page);if(viewState!=='正常'){let first=html.indexOf('</div></div>');const top=head(lookup[page][1],'状态设计预览；不访问任何生产接口。');const states={'加载中':['clock','正在读取数据','保留当前筛选；骨架不伪造数据。'],'空数据':['list','暂无记录','已成功读取，但当前范围无记录。'],'连接中断':['link','连接中断','保留上次成功快照，禁止假成功。'],'数据陈旧':['clock','数据可能陈旧','显示最后更新时间与来源，刷新失败不覆盖。'],'无权限':['lock','无权访问','请联系项目管理员。禁止展示受限数据。'],'只读':['shield','当前为只读模式','可查看和导出；写操作禁用。']};const st=states[viewState];html=top+`<div class="panel"><div class="empty">${I(st[0])}<b>${st[1]}</b><p>${st[2]}</p>${viewState!=='无权限'?btn('恢复正常示例','normal','refresh'):''}</div></div>`}document.querySelector('#page').innerHTML=html+stateBar();}
function go(p){if(!lookup[p])return;page=p;tab=0;query='';filter='全部';viewState='正常';history.replaceState(null,'','#'+p);render();document.querySelector('#workspace').scrollTop=0}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');clearTimeout(window.tt);window.tt=setTimeout(()=>e.classList.remove('show'),2600)}function openDetail(title){let d=document.querySelector('#drawer');d.innerHTML=`<div class="panelhead"><b>详情 · 设计预览</b><button class="close" data-action="close" aria-label="关闭">${I('x')}</button></div><div class="pad"><div class="eyebrow">DEMONSTRATION ONLY</div><h2>${esc(title)}</h2>${S('示例 · 无真实数据','warn')}<p class="muted">本地交互原型，无生产 API、无真实执行。</p></div><div class="tabs"><button class="sel">概览</button></div><div class="detailgrid"><div>对象</div><div>${esc(title)}</div><div>项目</div><div>Agent Hub · 示例</div><div>基线</div><div class="mono">0bc418319f628</div><div>关联需求</div><div>${(issueMap[page]||[]).map(n=>'#'+n).join(' / ')}</div><div>可信证据</div><div>未接入 · 未验证</div></div><div class="infoitem"><b>操作边界</b><p>真实动作必须绑定权限、当前版本与门禁；此原型只展示交互，不会提交、执行、部署或修改任何数据。</p></div><div class="pad">${btn('查看全链路','gotrace','branch')} ${btn('查看测试','gotest','test')} <button disabled>执行 / 授权</button></div>`;document.querySelector('#drawerback').classList.add('open');d.querySelector('button').focus()}
function closeDrawer(){document.querySelector('#drawerback').classList.remove('open')}
document.addEventListener('click',e=>{let el=e.target.closest('[data-go],[data-tab],[data-action],[data-node],[data-detail]');if(el){if(el.dataset.go){closeDrawer();go(el.dataset.go)}else if(el.dataset.tab!==undefined){tab=+el.dataset.tab;query='';filter='全部';render()}else if(el.dataset.node){selected=el.dataset.node;render()}else if(el.dataset.detail){openDetail(el.dataset.detail)}else{switch(el.dataset.action){case 'close':closeDrawer();break;case 'gotest':closeDrawer();go('tests');break;case 'gotrace':closeDrawer();go('trace');break;case 'clear':query='';filter='全部';render();break;case 'normal':viewState='正常';render();break;case 'detail':openDetail('运行与证据');break;case 'create':openDetail('新建任务 · 需可信后端授权');break;default:toast('设计预览：未连接任何生产服务，未执行外部操作。')}}}});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer();if(e.key==='Enter'&&e.target.matches('[data-detail],[data-go],[data-node]'))e.target.click()});document.querySelector('#drawerback').addEventListener('click',e=>{if(e.target.id==='drawerback')closeDrawer()});document.addEventListener('change',e=>{if(e.target.id==='filter'){filter=e.target.value;render()}if(e.target.id==='viewState'){viewState=e.target.value;render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){query=e.target.value;let pos=e.target.selectionStart;render();let n=document.querySelector('#search');n?.focus();n?.setSelectionRange(pos,pos)}});document.querySelector('#theme').onclick=()=>{dark=!dark;document.documentElement.dataset.theme=dark?'dark':'light';render()};document.querySelector('#collapse').onclick=()=>document.querySelector('#shell').classList.toggle('compact');let hash=location.hash.slice(1);go(lookup[hash]?hash:'overview');
</script></body></html>
