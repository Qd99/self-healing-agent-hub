<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V14 · 验收证据检查器</title><style>
:root{color-scheme:light;--bg:#eae9e5;--shell:#f2f1ed;--paper:#faf9f6;--line:#d9d8d2;--ink:#262b29;--muted:#686e69;--accent:#397b75;--soft:#e4eeea;--warn:#956b33;--bad:#a44c45;--shadow:0 1px 2px #20251d12,0 8px 22px #20251d09}html[data-theme=dark]{color-scheme:dark;--bg:#202321;--shell:#252826;--paper:#2c302d;--line:#414843;--ink:#e5e8e3;--muted:#a3ada6;--accent:#8ec4b9;--soft:#354742;--warn:#e3bb7c;--bad:#ed9c94;--shadow:0 1px 2px #0004,0 8px 22px #0002}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans CJK SC",sans-serif}button,input,select{font:inherit;color:inherit}button,select,input{border:1px solid var(--line);background:var(--paper);border-radius:7px;padding:7px 11px;min-height:36px}button{cursor:pointer;transition:background .15s,transform .12s,border-color .15s}button:hover{border-color:var(--accent)}button:active:not(:disabled){transform:scale(.98)}button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:3px}button:disabled{cursor:not-allowed;opacity:.55}a{color:var(--accent)}.shell{max-width:1600px;margin:18px auto;width:calc(100% - 36px);min-height:calc(100vh - 36px);display:grid;grid-template-columns:208px minmax(0,1fr);background:var(--shell);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}aside{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:8px}.brand{font-weight:650;letter-spacing:-.3px;margin:0 8px 24px}.kicker,.muted,small{color:var(--muted)}.kicker{font-size:12px;letter-spacing:.05em;margin:12px 8px 0}.nav{text-align:left;border-color:transparent;background:transparent}.nav[aria-pressed=true],.selected{background:var(--soft);color:var(--accent);border-color:var(--line)}.nav svg{vertical-align:-3px;margin-right:8px}main{min-width:0;padding:26px 28px}header,.row,.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:23px;letter-spacing:-.6px;margin:5px 0}h2{font-size:16px;margin:0}p{margin:6px 0}.mono,code{font:12px/1.55 ui-monospace,SFMono-Regular,Consolas,monospace;overflow-wrap:anywhere}.notice{margin:18px 0;padding:12px 15px;border:1px solid var(--line);border-radius:8px;background:var(--paper)}.notice strong{color:var(--warn)}.toolbar{margin:18px 0}.toolbar label{display:flex;align-items:center;gap:7px;white-space:nowrap}.split{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(290px,1fr);gap:16px;align-items:start}.panel{background:var(--paper);border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 1px #00000008;min-width:0}.panelhead,.detail{padding:16px 18px}.panelhead{border-bottom:1px solid var(--line)}.step{width:100%;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;display:grid;grid-template-columns:24px minmax(0,1fr) auto;align-items:center;gap:10px;text-align:left;padding:14px 18px}.step:last-child{border-bottom:0;border-radius:0 0 9px 9px}.step:hover,.step[aria-pressed=true]{background:var(--soft)}.dot{width:8px;height:8px;background:currentColor;border-radius:50%;display:inline-block;margin-right:6px}.ok{color:var(--accent)}.warn{color:var(--warn)}.bad{color:var(--bad)}.neutral{color:var(--muted)}.step strong{display:block;font-weight:600}.step small{display:block;overflow-wrap:anywhere}.state{font-size:12px;white-space:nowrap}.detail{min-height:280px;overflow-wrap:anywhere;animation:enter .16s ease-out}@keyframes enter{from{opacity:.6;transform:translateY(3px)}to{opacity:1;transform:none}}dl{display:grid;grid-template-columns:105px minmax(0,1fr);gap:9px 12px;margin:18px 0}dt{color:var(--muted)}dd{margin:0}hr{border:0;border-top:1px solid var(--line);margin:16px 0}.empty{padding:36px 20px;text-align:center}.number{font-size:22px;font-weight:650;letter-spacing:-.5px}.footer{font-size:12px;color:var(--muted);margin-top:18px}.grow{flex:1}input{min-width:0;width:100%}svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}@media(max-width:1100px){.shell{grid-template-columns:180px minmax(0,1fr)}main{padding:20px}.split{grid-template-columns:1fr}}@media(max-width:700px){.shell{display:block;width:100%;margin:0;min-height:100vh;border-radius:0}aside{border:0;border-bottom:1px solid var(--line);display:flex;flex-direction:row;flex-wrap:wrap;padding:12px;align-items:center}.brand{width:100%;margin:0 4px}.kicker,aside .footer{display:none}main{padding:16px}.toolbar label{width:100%}.toolbar select{flex:1}button,select,input{min-height:44px}input{font-size:16px}.step{padding:12px}.step small{font-size:12px}.state{white-space:normal}dl{grid-template-columns:90px minmax(0,1fr)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style><body><div class="shell"><aside><div class="brand">◈ &nbsp; Engineering Studio</div><div class="kicker">交付 / 测试 · 共享证据</div><button class="nav" id="delivery" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M6 3v12m0 0 4-4m-4 4-4-4M18 21V9m0 0 4 4m-4-4-4 4"/></svg>交付验收</button><button class="nav" id="quality" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M9 3h6m-5 0v6L4 19a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2L14 9V3M8 15h8"/></svg>测试有效性</button><div class="footer">V14 增量待评审<br>不连接业务服务</div></aside><main><header><div><span class="muted" id="crumb">交付中心 / 验收证据</span><h1 id="title">验收证据检查器</h1><p class="muted" id="subtitle">区分合并事实、受控演练与真实环境验收</p></div><button id="theme" aria-pressed="false">切换深色</button></header><div class="notice"><strong>离线示例 · 非生产状态</strong><p>以下记录为合成夹具，不表示任何实际测试已运行。原始证据服务尚未接入；无写入、执行或发布权限。</p></div><div class="toolbar"><label>证据状态 <select id="mode"><option value="ready">示例报告</option><option value="stale">陈旧</option><option value="readonly">只读</option><option value="loading">加载</option><option value="empty">空</option><option value="offline">断连</option><option value="forbidden">无权</option><option value="error">读取失败</option></select></label><label id="qualityMode" hidden>报告粒度 <select id="grain"><option value="aggregate">原工具聚合</option><option value="detailed">逐变异报告未提供</option></select></label><label class="grow">筛选 <input id="query" placeholder="场景、状态或标识"></label><button id="reset">重置筛选</button></div><div class="split"><section class="panel"><div class="panelhead row"><h2 id="listTitle">验收阶段</h2><small id="count" aria-live="polite"></small></div><div id="list"></div></section><section class="panel" aria-label="证据检查器"><div class="panelhead row"><h2>证据检查器</h2><small id="tier">只读</small></div><div id="detail" class="detail" aria-live="polite"></div></section></div><div class="footer">关联需求：<a href="https://github.com/Qd99/self-healing-agent-hub/issues/4">#4 集成验收</a> · <a href="https://github.com/Qd99/self-healing-agent-hub/issues/25">#25 测试有效性</a>　|　源码基线 <code>d7d01703431c</code>　|　未采集信息保持未知</div></main></div><script>
const $=id=>document.getElementById(id);let page='delivery',selected='';const delivery=[['merge','代码合并','示例 PR / 候选身份','已合并','ok','仅证明 Git 历史，不等于 CI、部署或授权。'],['local','本地门禁','示例 clean SHA / 命令 / 退出码','报告待复核','warn','原始日志、报告摘要、环境和独立复核仍需取得。'],['ack','受控演练 · 丢失提案 ACK','hub-disconnect-lost-ack','示例通过','ok','相同 submissionId 重放，核对幂等受理。'],['cleanup','受控演练 · Worker 中断','worker-sigkill-resource-cleanup','待清理','warn','清理未确认：不得领取新任务、释放锁或发成功回执。'],['publish','受控演练 · 发布未知','publish-unconfirmed-manual-review','待核对','warn','PUBLICATION_UNCERTAIN；先读回外部结果，不盲目重发。'],['base','受控演练 · 基线变化','base-moved-refuse-execute','拒绝执行','bad','BASE_MOVED；候选证据与旧审批不可重绑。'],['external','真实环境验收','Docker / Jenkins / 可信 GitHub 身份','未执行','neutral','受控外部响应不得替代真实外部环境验收。'],['deploy','部署与实际版本','制品 / 环境 / 健康证据','未知','neutral','没有部署回执或环境实测，不得显示上线。']];const quality=[['native','原工具聚合结果','native-reported / 示例','原口径','neutral','示例总数 10、工具 reported killed 8；不是目标断言检出数。'],['strict','严格断言检出率','需逐变异可信报告','N/A','warn','未收到逐变异断言、失败类型和可信证据；不可反推严格分数。'],['isolation','执行隔离与清理','镜像 / harness / 资源释放','未知','neutral','宿主临时目录不等于安全隔离。'],['gate','普通测试与质量门禁','独立策略 / 候选 SHA','未核验','neutral','变异评估首期仅建议，不替代红绿差分或发布授权。']];const states={loading:'正在加载示例报告',empty:'没有报告',offline:'连接断开 · 不显示旧数据为最新',forbidden:'没有访问权限',error:'读取失败'};const valid=['ready','stale','readonly'];function rows(){return page==='delivery'?delivery:$('grain').value==='aggregate'?quality:quality.slice(1)}function canShow(mode){return valid.includes(mode)}function render(){let mode=$('mode').value,q=$('query').value.trim().toLowerCase(),rs=rows().filter(r=>r.join(' ').toLowerCase().includes(q));$('qualityMode').style.display=page==='quality'?'flex':'none';$('listTitle').textContent=page==='delivery'?'验收阶段':'报告完整性';$('tier').textContent=mode==='stale'?'历史 · 陈旧':'只读';$('count').textContent=canShow(mode)?rs.length+' 项':'—';$('list').replaceChildren();$('detail').replaceChildren();if(!canShow(mode)){selected='';$('list').innerHTML='<div class="empty">'+states[mode]+'</div>';$('detail').innerHTML='<p class="muted">当前没有可确认结果，不显示分数、通过或历史详情。</p>';if(mode==='error'||mode==='offline'){let b=document.createElement('button');b.textContent='恢复本地示例';b.onclick=()=>{$('mode').value='ready';render()};$('detail').append(b)}return}if(!rs.some(r=>r[0]===selected))selected=rs[0]?.[0]||'';for(const r of rs){let b=document.createElement('button');b.className='step';b.setAttribute('aria-pressed',String(r[0]===selected));b.innerHTML='<span class="'+(mode==='stale'?'neutral':r[4])+'"><span class="dot"></span></span><span><strong>'+r[1]+'</strong><small>'+r[2]+'</small></span><span class="state '+(mode==='stale'?'neutral':r[4])+'">'+(mode==='stale'?'历史 · ':'')+r[3]+'</span>';b.onclick=()=>{selected=r[0];render();$('list').querySelector('[aria-pressed=true]')?.focus()};$('list').append(b)}if(!rs.length){$('list').innerHTML='<div class="empty">没有匹配记录</div>';$('detail').innerHTML='<p>调整筛选后选择记录。</p>';return}let r=rs.find(x=>x[0]===selected);let tier=page==='delivery'&&['ack','cleanup','publish','base'].includes(r[0])?'controlled（示例）':r[0]==='native'?'native-reported（示例）':'未核验';$('detail').innerHTML='<div class="row"><h2>'+r[1]+'</h2><span class="state '+(mode==='stale'?'neutral':r[4])+'">'+(mode==='stale'?'陈旧 · ':r[3])+'</span></div><dl><dt>证据层级</dt><dd>'+tier+'</dd><dt>标识</dt><dd class="mono">'+r[2]+'</dd><dt>报告 SHA / tree</dt><dd>示例未提供</dd><dt>独立复核</dt><dd>未完成</dd><dt>执行授权</dt><dd>未授予</dd></dl><hr><p>'+r[5]+'</p>'+((r[0]==='native'||r[0]==='strict')?'<hr><span class="muted">严格断言检出率</span><div class="number">N/A</div><p class="muted">聚合报告不可生成逐变异列表。</p>':'')+'<hr><button disabled>外部操作 · 未授权</button><p class="muted">该设计仅展示边界，不触发重试、部署、排除或审批。</p>'}
function switchPage(next){page=next;selected='';$('query').value='';$('delivery').setAttribute('aria-pressed',String(next==='delivery'));$('quality').setAttribute('aria-pressed',String(next==='quality'));$('crumb').textContent=next==='delivery'?'交付中心 / 验收证据':'测试中心 / 测试有效性';$('title').textContent=next==='delivery'?'验收证据检查器':'原工具报告 · 证据粒度';$('subtitle').textContent=next==='delivery'?'区分合并事实、受控演练与真实环境验收':'原生聚合不代表逐变异断言证据';render()}$('delivery').onclick=()=>switchPage('delivery');$('quality').onclick=()=>switchPage('quality');$('theme').onclick=()=>{let dark=document.documentElement.dataset.theme!=='dark';document.documentElement.dataset.theme=dark?'dark':'light';$('theme').textContent=dark?'切换浅色':'切换深色';$('theme').setAttribute('aria-pressed',String(dark))};$('mode').onchange=render;$('grain').onchange=render;$('query').oninput=render;$('reset').onclick=()=>{$('query').value='';render()};switchPage(location.hash==='#quality'?'quality':'delivery');
</script></body></html>
